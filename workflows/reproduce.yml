name: Test, reproduce, and publish artifact

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-reproduce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          pytest -q | tee results/test_report.txt

      - name: Reproduce reports and figures
        shell: bash
        run: |
          set -o pipefail
          python scripts/reproduce.py | tee results/reproduction_console.txt

      - name: Syntax audit
        run: python -m py_compile app/streamlit_app.py src/ideaforge/*.py scripts/*.py

      - name: Refresh SHA-256 manifest
        run: python scripts/make_checksums.py

      - name: Build reproducibility artifact ZIP
        shell: bash
        run: |
          rm -rf artifact IdeaForge-AI-v1.0.0-reproducibility-artifact.zip
          mkdir -p artifact
          cp -r results artifact/results
          cp -r figures artifact/figures
          cp QA_REPORT.md SOURCE_TRACEABILITY.md SHA256SUMS.txt artifact/
          printf 'IdeaForge AI v1.0.0 reproducibility artifact\n' > artifact/ARTIFACT_README.txt
          printf 'Generated by GitHub Actions after tests, reproduction, and syntax audit passed.\n' >> artifact/ARTIFACT_README.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('artifact')
          out=Path('IdeaForge-AI-v1.0.0-reproducibility-artifact.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p,p.as_posix())
          print(f'Built {out} ({out.stat().st_size} bytes)')
          PY
          test -s IdeaForge-AI-v1.0.0-reproducibility-artifact.zip

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdeaForge-AI-v1.0.0-reproducibility
          path: IdeaForge-AI-v1.0.0-reproducibility-artifact.zip
          if-no-files-found: error
          retention-days: 30
